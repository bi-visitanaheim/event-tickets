  const nx=e?nextOption(e):1,cap=i?i.cap:4,cur=Math.min(cap,Math.max(1,Number(d.tix)||(i?(i.left||cap):cap)));
  return dlg(m.onBehalf?"Add a request":"Request tickets",`${e&&!m.pickEvent?`<div class="callout ${nx>1?"warn":""}">${esc(title(e))} · ${fmtLong(ed(e))} · ${fmtTime(e.time)}<br>${nx===1?"You'll be <b>Option 1</b>.":`You'll be <b>Option ${nx}</b>. If an earlier option can't go, you move up.`}</div>`:""}
  <form id="reqform" novalidate style="display:grid;gap:18px">${evPick}
  <fieldset><legend>VA requester</legend><div class="grid2">
   ${field("f-name","VA Requestor's full name",`<input id="f-name" value="${v("name",m.onBehalf?"":S.me.name)}" autocomplete="name">`,"",er.name)}
   ${field("f-title","VA Requestor's title",`<input id="f-title" value="${v("title",m.onBehalf?"":prefs.title||"")}">`,"",er.title)}
   ${field("f-dept","VA Requestor's department",`<select id="f-dept"><option value="">Choose…</option>${DEPTS.map(x=>`<option ${(d.dept!==undefined?d.dept:(m.onBehalf?"":prefs.dept))===x?"selected":""}>${x}</option>`).join("")}</select>`,"",er.dept)}
   ${field("f-remail",m.onBehalf?"Requester's email":"VA Requestor's work email",`<input id="f-remail" type="email" value="${v("remail",m.onBehalf?"":(S.me.email||""))}" autocomplete="email" placeholder="name@visitanaheim.org">`,m.onBehalf?"So the request shows on their My requests page":"We email your confirmation here, and it lets you see your requests.",er.remail)}
  </div></fieldset>
  <fieldset><legend>Client</legend><div class="grid2">
   ${field("f-cname","Client's full name",`<input id="f-cname" value="${v("cname","")}">`,"",er.cname)}
   ${field("f-ctitle","Client's title",`<input id="f-ctitle" value="${v("ctitle","")}">`,"",er.ctitle)}
   ${field("f-ccomp","Client's company",`<input id="f-ccomp" value="${v("ccomp","")}">`,"",er.ccomp)}
  </div></fieldset>
  <fieldset><legend>Request</legend>
   ${field("f-reason","Business reason",`<textarea id="f-reason" rows="3" placeholder="What's the opportunity, and why this event?">${v("reason","")}</textarea>`,"Ronnie reads this when more than one person wants the same event.",er.reason)}
   <div class="field"><span class="flabel" id="tix-l">How many tickets in total do you need?</span><input type="hidden" id="f-tix" value="${cur}">${tixPicker(cur,cap,i?i.left:cap)}<span class="hint" id="tix-hint">${tixHint(cur,i)}</span></div>
   <div class="field ${er.park?"invalid":""}"><span class="flabel" id="park-l">Will your client be parking a vehicle?</span><div class="radios" role="radiogroup" aria-labelledby="park-l"><label><input type="radio" name="f-park" value="yes" ${d.park==="yes"?"checked":""}> Yes</label><label><input type="radio" name="f-park" value="no" ${d.park==="no"?"checked":""}> No</label></div><span class="hint">We have 1 parking pass, if available.${i&&i.pcap&&!i.parkLeft?" It's already spoken for, so you'd be next in line for it.":""}</span>${er.park?`<span class="err">${er.park}</span>`:""}</div>
  </fieldset>
  ${guestRows(cur,d)}
  <fieldset>
   ${field("f-email","What email address would you like them sent to?",`<input id="f-email" type="email" value="${v("email","")}" autocomplete="email">`,"Tickets are typically transferred the week of the event, in case of cancellation.",er.email)}
  </fieldset></form>`,`<button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="submitreq">${m.onBehalf?"Add request":"Submit request"}</button>`);
}
function dlg(t,body,foot,cls){return `<div class="scrim" data-a="close"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dialog ${cls||""}"><div class="dialog-head"><h2 id="dlg-t">${t}</h2><button class="x" data-a="close" aria-label="Close">×</button></div><div class="dialog-body">${body}</div>${foot?`<div class="dialog-foot">${foot}</div>`:""}</div></div>`}
function mailOn(){return !!(window.__mail&&window.__mail.enabled)}

function overlayHtml(){

  if(m.type==="mytix"){const r=R(m.id),e=r&&evById(r.eventId);if(!r||!e)return"";const i=inv(e);const own=HOLDS.includes(r.status)?Number(r.tickets)||0:0;const left=i.left+own;

    ${field("rd-who","Decision by",`<select id="rd-who">${settings().approvers.map(a=>`<option ${a.name===r.approver?"selected":""}>${esc(a.name)}</option>`).join("")}</select>`)}
    ${field("rd-note","Note (optional)",`<input id="rd-note">`)}`,`<button class="btn" data-a="close">Cancel</button><button class="btn danger" data-a="recordno" data-v="${r.id}">Not approved</button><button class="btn primary" data-a="recordyes" data-v="${r.id}">Approved</button>`,"narrow")}

async function move(v,dir){const r=R(v),e=evById(r.eventId);const line=inv(e).line;const k=line.indexOf(r),j=k+dir;if(j<0||j>=line.length)return;const o=line[j],a=r.option,b=o.option;await upd(r,{option:b},`Moved to Option ${b}`);await upd(o,{option:a},`Moved to Option ${a}`);toast(`${first(r.requesterName)} is now Option ${b}`)}
function copy(text,el,msg){const done=()=>toast(msg);try{navigator.clipboard.writeText(text).then(done,()=>{fallback()})}catch(x){fallback()}function fallback(){if(el){el.focus();el.select();toast("Press Ctrl+C (or ⌘C) to copy")}else toast(text)}}
function sortEvents(){D.events.sort((a,b)=>(a.date+(a.time||"99")).localeCompare(b.date+(b.time||"99")))}

/* ---------- Excel ---------- */
async function getExcel(){for(let k=0;k<40&&!window.ExcelJS;k++)await new Promise(r=>setTimeout(r,150));return window.ExcelJS}
async function saveXlsx(wb,name){const buf=await wb.xlsx.writeBuffer();if(!downloads){toast("Downloads aren't available here. Try opening the app in your browser.");return}try{await downloads.save({filename:name,data:buf})}catch(e){if(e&&e.code!=="declined")toast("The download didn't start. Try again.")}}
const argb=h=>"FF"+h.replace("#","").toUpperCase();
async function exportTracker(){const X=await getExcel();if(!X){toast("Still getting the download ready. Try again in a moment.");return}
  const wb=new X.Workbook();const ws=wb.addWorksheet("Ducks & Honda Center");ws.columns=[{width:7},{width:10},{width:30},{width:10},{width:28},{width:28},{width:28},{width:32},{width:48}];
  ws.mergeCells("A1:I1");ws.getCell("A1").value="DUCKS / HONDA CENTER / ANGELS SEASON TICKETS";ws.getCell("A1").font={bold:true,size:14,color:{argb:"FF125C60"}};
  const hr=ws.addRow(["DAY","DATE","OPPONENT","TIME","VISIT ANAHEIM REQUESTER","ATTENDEE NAME","TITLE","COMPANY","ADDITIONAL NOTES"]);hr.eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF125C60"}}});
  let lastM="";D.events.forEach(e=>{const d=ed(e);const mk=MON[d.getMonth()].toUpperCase()+" "+d.getFullYear();if(mk!==lastM){const r=ws.addRow([mk]);r.font={bold:true};lastM=mk}
    trackerRows(e).forEach(l=>{const row=ws.addRow([DOW[d.getDay()],md(d),e.name,fmtTime(e.time),...l.v]);if(l.c)for(let c=1;c<=4;c++)row.getCell(c).fill={type:"pattern",pattern:"solid",fgColor:{argb:argb(l.c)}}})});
  const k=wb.addWorksheet("Color Key");k.addRow(["Color Coding"]).font={bold:true};Object.entries(KEY_COLORS).forEach(([l,c])=>{const r=k.addRow(["",l]);r.getCell(1).fill={type:"pattern",pattern:"solid",fgColor:{argb:argb(c)}}});k.getColumn(2).width=40;
  await saveXlsx(wb,"Ducks - Angels Tickets.xlsx")}
async function exportJoy(){const X=await getExcel();if(!X){toast("Still getting the download ready. Try again in a moment.");return}
  const y=S.joyYear;const wb=new X.Workbook();
  MON.forEach((mm,m)=>{const ws=wb.addWorksheet(mm.slice(0,3).toUpperCase()==="SEP"?"SEPT":mm.slice(0,3).toUpperCase());ws.columns=[{width:12},{width:32},{width:10},{width:34},{width:38},{width:30}];
    ws.mergeCells("A1:F1");ws.getCell("A1").value=mm.toUpperCase();ws.getCell("A1").font={bold:true,size:14,color:{argb:"FF125C60"}};
    const r=joyRows(y,m);[["ANGELS",r.angels],["HONDA CENTER",r.honda]].forEach(([h,rows])=>{ws.addRow([]);ws.addRow([h]).font={bold:true};const hr=ws.addRow(["DATE","EVENT","TIME","COMPANY/ORGANIZATION","TYPE","Ticket Amount"]);hr.eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF125C60"}}});
      rows.forEach(([e,org,t,a])=>ws.addRow([md(ed(e))+"/"+String(ed(e).getFullYear()).slice(2),e.name,fmtTime(e.time),org,t,a]))})});
  await saveXlsx(wb,`${y} Honda Center-Angels Allocation Report (Nana and Joy Only).xlsx`)}

document.addEventListener("click",ev=>{const t=ev.target.closest("[data-a]");if(!t||t.disabled)return;const a=t.dataset.a;if(!A[a])return;ev.preventDefault();const menu=t.closest("details.more");if(menu)menu.open=false;A[a](t.dataset.v)});

(()=>{const p=document.createElement("div");p.id="pop";p.className="pop";p.setAttribute("role","tooltip");document.body.appendChild(p);let cur=null;

(()=>{let x0=null,y0=0;document.addEventListener("touchstart",ev=>{const w=ev.target.closest&&ev.target.closest("#calwrap");x0=w?ev.touches[0].clientX:null;y0=w?ev.touches[0].clientY:0},{passive:true});document.addEventListener("touchend",ev=>{if(x0==null)return;const dx=ev.changedTouches[0].clientX-x0,dy=ev.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)A.month(dx>0?-1:1)},{passive:true})})();

async function runSearch(q){const box=document.getElementById("lk-res");if(!box)return;if(!userCap){box.innerHTML='<p class="muted">Search isn\'t available here.</p>';return}const hits=await userCap.search(q);S.hits=hits;const b2=document.getElementById("lk-res");if(!b2)return;b2.innerHTML=hits.length?hits.map(h=>`<button class="btn" style="justify-content:flex-start" data-a="pickperson" data-v="${esc(h.id)}"><img src="${esc(h.avatarUrl)}" alt="" style="width:24px;height:24px;border-radius:50%"> <span class="pname"></span></button>`).join(""):'<p class="muted" style="margin:0">No matches yet. Keep typing.</p>';[...b2.querySelectorAll(".pname")].forEach((el,k)=>el.textContent=hits[k].name)}

(async()=>{
  const cl=window.claude;if(!cl||!cl.use){S.noDb=true;renderMain();return}
  const [dbx,ux,dx]=await Promise.all([cl.use("db"),cl.use("user"),cl.use("downloads")]);db=dbx;downloads=dx;userCap=ux;
  if(ux){try{const me=await ux.me();S.me={name:me.name||"",email:me.email||null,id:me.id||null,avatarUrl:me.avatarUrl||""};S.canEdit=!!(me.canEdit||me.isOwner)}catch(e){}}
  S.userReady=true;if(!S.canEdit)S.mode="requester";
  if(!db){S.noDb=true;renderMain();return}
  let got={ev:false,rq:false},jumped=false;const ready=()=>{if(got.ev&&got.rq){S.loaded=1;if(!jumped){jumped=true;try{if(S.mode==='requester'&&isApprover()&&D.requests.some(r=>r.status==='approval'))S.tab.requester='approvals'}catch(x){}const cm=S.month;const has=D.events.some(e=>ed(e)>=TODAY&&ed(e).getMonth()===cm.getMonth()&&ed(e).getFullYear()===cm.getFullYear()&&e.venue===S.venue);const nx=D.events.find(e=>ed(e)>=TODAY&&e.venue===S.venue);if(!has&&nx)S.month=new Date(ed(nx).getFullYear(),ed(nx).getMonth(),1)}}renderAll()};
  db.collection("events").onSnapshot(s=>{D.events=s.docs.map(d=>Object.assign({id:d.id},d.data()));sortEvents();got.ev=true;ready()},e=>{console.error(e);S.noDb=true;renderMain()});
  db.collection("requests").onSnapshot(s=>{D.requests=s.docs.map(d=>{const x=d.data();return Object.assign({id:d.id},x,{history:x.history?x.history.slice():[]})});got.rq=true;ready()},e=>console.error(e));
  db.doc("settings/app").onSnapshot(s=>{if(s.exists){D.settings=Object.assign({},s.data())}renderAll()},e=>console.error(e));
})();
})();
