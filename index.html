@font-face{font-family:"VA Sharp";src:url("/fonts/ss-book.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"VA Sharp";src:url("/fonts/ss-smbd.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"VA Sharp";src:url("/fonts/ss-bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"VA Sharp";src:url("/fonts/ss-xbdobl.woff2") format("woff2");font-weight:800;font-style:italic;font-display:swap}
:root{
  --bg:#F9F9F2;--surface:#FFFFFF;--surface2:#F1F2EB;--surface3:#E8EAE1;--ink:#231F20;--ink2:#4A4647;--muted:#6B6668;--line:#E3E2DA;
  --brand:#125C60;--brand-hover:#0E4B4E;--brand-bright:#43A3A3;--brand-mid:#77C7C9;--brand-pale:#B4D9E3;--brand-soft:#DCEEF2;--on-brand:#F9F9F2;
  --ok:#1F7A5C;--ok-soft:#DCF1E8;--warn:#9A3F0A;--warn-soft:#FCE4D1;--warn-dot:#FF8022;--bad:#A10009;--bad-soft:#FCDDDF;--hold:#4A4647;--hold-soft:#E8E6DE;
  --shadow:0 18px 40px rgba(35,31,32,.14),0 6px 14px rgba(35,31,32,.08);--shadow-sm:0 1px 2px rgba(35,31,32,.06),0 2px 6px rgba(35,31,32,.06);
  --font:"VA Sharp","Proxima Nova",system-ui,-apple-system,"Segoe UI",sans-serif;--r:14px;--r-sm:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0C1D1F;--surface:#12292B;--surface2:#183336;--surface3:#1F3E41;--ink:#F9F9F2;--ink2:#D6DAD3;--muted:#A2ACA8;--line:#27464A;
  --brand:#77C7C9;--brand-hover:#9AD7D8;--brand-bright:#43A3A3;--brand-mid:#77C7C9;--brand-pale:#2A5A5E;--brand-soft:#1C4144;--on-brand:#0C1D1F;
  --ok:#6CD0A8;--ok-soft:#173D32;--warn:#FFAC62;--warn-soft:#452C18;--bad:#FF7980;--bad-soft:#44191D;--hold:#C9CCC4;--hold-soft:#26393B;--shadow:0 18px 40px rgba(0,0,0,.5);--shadow-sm:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0C1D1F;--surface:#12292B;--surface2:#183336;--surface3:#1F3E41;--ink:#F9F9F2;--ink2:#D6DAD3;--muted:#A2ACA8;--line:#27464A;
  --brand:#77C7C9;--brand-hover:#9AD7D8;--brand-bright:#43A3A3;--brand-mid:#77C7C9;--brand-pale:#2A5A5E;--brand-soft:#1C4144;--on-brand:#0C1D1F;
  --ok:#6CD0A8;--ok-soft:#173D32;--warn:#FFAC62;--warn-soft:#452C18;--bad:#FF7980;--bad-soft:#44191D;--hold:#C9CCC4;--hold-soft:#26393B;--shadow:0 18px 40px rgba(0,0,0,.5);--shadow-sm:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand-mid);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px}
.muted{color:var(--muted)}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{height:32px;width:auto;display:block}.logo-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block;height:24px}}
:root[data-theme="dark"] .logo-light{display:none}:root[data-theme="dark"] .logo-dark{display:block;height:24px}
.app-name{font-weight:800;font-style:italic;font-size:21px;letter-spacing:-.01em;color:var(--brand);padding-left:14px;border-left:1px solid var(--line);line-height:1}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.who img{width:28px;height:28px;border-radius:50%}
.modes{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.modes button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink2)}
.modes button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);box-shadow:var(--shadow-sm)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center;font-size:14.5px}
.nav button[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand-bright)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:800;display:inline-grid;place-items:center}
main{padding-block:22px 72px}
h1{font-weight:800;font-style:italic;font-size:clamp(26px,3.4vw,38px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-weight:700;font-size:19px;margin:0;text-wrap:balance}
h3{font-weight:700;font-size:15.5px;margin:0}
.lede{color:var(--ink2);max-width:66ch;margin:6px 0 0}
.overline{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-bright)}
.page-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--brand-soft);color:var(--brand);border-radius:var(--r);padding:12px 16px;font-weight:600;margin-bottom:16px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner .btn{margin-left:auto}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:999px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--brand-mid)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.lg{padding:12px 22px;font-size:15.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip-f{border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink2)}
.chip-f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.s-available{background:var(--ok-soft);color:var(--ok)}
.s-partial{background:var(--brand-soft);color:var(--brand)}
.s-requested{background:var(--warn-soft);color:var(--warn)}
.s-full{background:var(--brand);color:var(--on-brand)}
.s-hold{background:var(--hold-soft);color:var(--hold)}
.s-soon{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--muted)}
.s-past{background:var(--surface2);color:var(--muted)}
.r-new{background:var(--warn-soft);color:var(--warn)}
.r-confirmed{background:var(--brand-soft);color:var(--brand)}
.r-approval{background:var(--warn-soft);color:var(--warn)}
.r-approved{background:var(--ok-soft);color:var(--ok)}
.r-backup{background:var(--brand-soft);color:var(--brand)}
.r-sent{background:var(--brand);color:var(--on-brand)}
.r-used{background:var(--surface2);color:var(--ink2)}
.r-declined,.r-cancelled,.r-returned,.r-not_used,.r-traded{background:var(--bad-soft);color:var(--bad)}
.tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:5px;background:var(--surface3);color:var(--muted)}
/* seats */
.seats{display:inline-flex;gap:3px;align-items:center}
.seat{width:12px;height:15px;border-radius:4px 4px 3px 3px;border:1.5px solid var(--brand-mid);background:transparent}
.seat.on{background:var(--brand);border-color:var(--brand)}
.seat.hold{background:var(--hold-soft);border-color:var(--hold)}
.park{margin-left:4px;width:17px;height:17px;border-radius:5px;border:1.5px solid var(--brand-mid);font-size:10px;font-weight:800;display:grid;place-items:center;color:var(--brand)}
.park.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.park.hold{background:var(--hold-soft);border-color:var(--hold);color:var(--hold)}
.park.none{opacity:.35;border-style:dashed}
.seats.big .seat{width:26px;height:32px;border-radius:8px 8px 5px 5px}
.seats.big .park{width:32px;height:32px;font-size:14px;border-radius:8px;margin-left:8px}
/* up next rail: ticket stubs */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,260px);gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.stub{scroll-snap-align:start;position:relative;display:grid;grid-template-columns:72px 1fr;border:0;padding:0;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease;min-height:112px}
.stub:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.stub .stub-date{background:var(--brand);color:var(--on-brand);display:grid;place-content:center;justify-items:center;line-height:1;gap:4px;position:relative}
.stub .stub-date::after{content:"";position:absolute;right:-1px;top:8px;bottom:8px;border-right:2px dashed color-mix(in srgb,var(--bg) 70%,transparent)}
.stub .stub-date .m{font-size:11px;font-weight:800;letter-spacing:.14em}
.stub .stub-date .d{font-size:30px;font-weight:800;font-style:italic}
.stub .stub-date .w{font-size:11px;font-weight:700;opacity:.8}
.stub .stub-body{padding:12px 14px;display:grid;gap:6px;align-content:space-between}
.stub .stub-title{font-weight:700;font-size:15px;line-height:1.25}
.stub .stub-meta{font-size:12.5px;color:var(--muted)}
.stub.s-full .stub-date,.stub.s-hold .stub-date{background:var(--ink2)}
.stub.s-requested .stub-date{background:var(--brand-bright)}
/* calendar */
.cal-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 12px}
.cal-title{font-weight:800;font-style:italic;font-size:28px;letter-spacing:-.015em;min-width:220px}
.cal-wrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dh{padding:10px 12px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface2)}
.cal .cell{min-height:118px;padding:6px 6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.cal .cell:nth-child(7n){border-right:0}
.cal .cell.out{background:color-mix(in srgb,var(--surface2) 60%,transparent)}
.cal .cell.out .num{opacity:.45}
.cal .cell.wknd{background:color-mix(in srgb,var(--brand-soft) 22%,transparent)}
.cal .num{font-size:12.5px;font-weight:800;color:var(--muted);width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cal .cell.today .num{background:var(--brand-bright);color:#fff}
.evchip{border:0;text-align:left;border-radius:9px;padding:6px 8px 7px;font-size:12.5px;font-weight:700;line-height:1.2;display:grid;gap:4px;width:100%;min-width:0;transition:transform .12s ease,box-shadow .12s ease;border-left:4px solid transparent}
.evchip:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.evchip .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evchip .sub{display:flex;gap:6px;align-items:center;justify-content:space-between;font-weight:600;font-size:11.5px;opacity:.9}
.evchip .seats .seat{width:7px;height:9px;border-width:1px;border-radius:2px}
.evchip .seats .park{width:10px;height:10px;font-size:6.5px;margin-left:2px;border-width:1px;border-radius:3px}
.evchip.s-available{background:var(--ok-soft);color:var(--ok);border-left-color:var(--ok)}
.evchip.s-partial{background:var(--brand-soft);color:var(--brand);border-left-color:var(--brand-bright)}
.evchip.s-requested{background:var(--warn-soft);color:var(--warn);border-left-color:var(--warn-dot)}
.evchip.s-full{background:var(--brand);color:var(--on-brand);border-left-color:var(--brand-hover)}
.evchip.s-full .seat.on,.evchip.s-full .park.on{background:var(--on-brand);border-color:var(--on-brand)}
.evchip.s-hold{background:var(--hold-soft);color:var(--hold);border-left-color:var(--hold)}
.evchip.s-soon{background:var(--surface);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);border-left-color:var(--muted)}
.evchip.s-past{background:var(--surface2);color:var(--muted)}
.cal-anim{animation:calin .28s ease}
@keyframes calin{from{opacity:.2;transform:translateX(var(--dx,14px))}to{opacity:1;transform:none}}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (max-width:760px){.cal .cell{min-height:74px;padding:4px}.cal .dh{padding:8px 4px;font-size:10px;letter-spacing:.06em}.evchip{padding:3px 4px;font-size:10.5px;border-left-width:3px}.evchip .sub{display:none}}
/* agenda list */
.agenda{display:grid;gap:18px}
.agenda-month h2{font-weight:800;font-style:italic;font-size:22px;margin-bottom:8px}
.alist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.arow{display:grid;grid-template-columns:62px minmax(0,1.3fr) minmax(0,1.6fr) auto;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.arow:first-child{border-top:0}
.arow:hover{background:var(--surface2)}
.dblock{display:grid;justify-items:center;line-height:1.05;padding:6px 0;border-radius:10px;background:var(--surface2)}
.dblock .w{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dblock .d{font-size:24px;font-weight:800;font-style:italic;color:var(--ink)}
.etitle{font-weight:700;font-size:15.5px}
.emeta{font-size:13px;color:var(--muted)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.optchip{font-size:12.5px;border-radius:999px;padding:3px 10px;background:var(--surface2);font-weight:600}
.optchip b{color:var(--brand-bright);font-style:italic;margin-right:4px}
.arow .right{display:grid;justify-items:end;gap:6px}
@media (max-width:760px){.arow{grid-template-columns:54px minmax(0,1fr);row-gap:8px}.arow .opts,.arow .right{grid-column:2;justify-items:start}}
/* sheet (event detail) */
.scrim{position:fixed;inset:0;background:rgba(12,29,31,.5);z-index:40;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.5}}
.sheet-hero{background:var(--brand);color:var(--on-brand);padding:22px 22px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start}
.sheet-hero .big-date{display:grid;justify-items:center;line-height:1;background:rgba(249,249,242,.14);border-radius:12px;padding:10px 12px;min-width:70px}
.sheet-hero .big-date .m{font-size:11px;font-weight:800;letter-spacing:.14em}
.sheet-hero .big-date .d{font-size:36px;font-weight:800;font-style:italic}
.sheet-hero h2{font-weight:800;font-style:italic;font-size:24px;line-height:1.1}
.sheet-hero .meta{opacity:.85;font-size:14px;margin-top:4px}
.x{border:0;background:rgba(249,249,242,.16);color:inherit;width:36px;height:36px;border-radius:50%;font-size:20px;flex:none}
.sheet-body{padding:20px 22px 32px;overflow-y:auto;display:grid;gap:18px;align-content:start;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.invbox{background:var(--surface2);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.queue{display:grid;gap:0;position:relative}
.qrow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qnum{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;font-style:italic;display:grid;place-items:center}
.qrow.win .qnum{background:var(--brand);color:var(--on-brand)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.callout{background:var(--brand-soft);color:var(--brand);border-radius:var(--r-sm);padding:11px 14px;font-size:14px;font-weight:600}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.plain{background:var(--surface2);color:var(--ink2)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:min(720px,100%);max-height:calc(100vh - 32px);overflow-y:auto;position:relative;animation:rise .2s ease-out}
.dialog.narrow{width:min(540px,100%)}
@keyframes rise{from{transform:translateY(10px);opacity:.5}}
.dialog-head{padding:20px 24px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;background:var(--surface);z-index:1}
.dialog-head h2{font-weight:800;font-style:italic;font-size:22px}
.dialog-head .x{background:var(--surface2);color:var(--ink);margin-left:auto}
.dialog-body{padding:20px 24px;display:grid;gap:18px}
.dialog-foot{padding:14px 24px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
fieldset{border:0;padding:0;margin:0;display:grid;gap:12px}
legend{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-bright);margin-bottom:10px;padding:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.field{display:grid;gap:5px}
.field>label,.flabel{font-size:13px;font-weight:700;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;min-width:0;width:100%}
.field textarea{resize:vertical}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--bad);font-weight:700}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad)}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-weight:700;font-size:14px}
.radios label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.msgbox{background:var(--surface2);border-radius:var(--r-sm);padding:14px;white-space:pre-wrap;font-size:14px;line-height:1.55;max-height:300px;overflow:auto;border:1px solid var(--line)}
.copyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.copyrow code{background:var(--surface2);padding:3px 8px;border-radius:6px;font-family:inherit;font-weight:700}
/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(218px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface2);border-radius:16px;padding:10px;display:grid;gap:10px;align-content:start;min-height:120px}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 2px}
.col-head h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.col-head .n{margin-left:auto;font-weight:800;font-size:13px;color:var(--muted)}
.col-help{font-size:12px;color:var(--muted);padding:0 6px;margin-top:-6px}
.wcard{background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:8px;box-shadow:var(--shadow-sm);border:1px solid var(--line);animation:rise .2s ease-out}
.wcard.due{border-color:var(--warn-dot);box-shadow:0 0 0 1px var(--warn-dot)}
.wcard .w-top{display:flex;gap:8px;align-items:center}
.wcard .w-date{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-bright)}
.wcard .w-title{font-weight:700;font-size:14.5px;line-height:1.25}
.wcard .w-who{font-size:13px;color:var(--ink2)}
.wcard .w-who b{color:var(--ink)}
.wcard .w-foot{display:flex;gap:6px;align-items:center;justify-content:space-between}
.optbadge{font-weight:800;font-style:italic;color:var(--brand-bright);font-size:13px}
details.more{position:relative}
details.more summary{list-style:none;border:1px solid var(--line);border-radius:999px;width:32px;height:30px;display:grid;place-items:center;cursor:pointer;font-weight:800;color:var(--ink2);background:var(--surface)}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{background:var(--surface2)}
details.more .menu{position:absolute;right:0;top:36px;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:grid;min-width:210px}
details.more .menu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;font-weight:600;font-size:13.5px}
details.more .menu button:hover{background:var(--surface2)}
details.more .menu button.danger{color:var(--bad)}
.done-list{margin-top:18px}
.done-list summary{cursor:pointer;font-weight:700;color:var(--ink2)}
/* cards, tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px}
.card-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:30px;font-weight:800;font-style:italic;line-height:1.1;color:var(--brand)}
.stat span{font-size:12.5px;font-weight:700;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:#125C60;color:#F9F9F2;text-align:left;font-weight:700;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td.nw{white-space:nowrap}
tr.band td{background:var(--surface2);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--brand)}
tr.ev-first td{border-top:2px solid var(--line)}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid rgba(35,31,32,.25);vertical-align:-1px;margin-right:6px}
.kbar{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:10px 0}
.monthtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.monthtabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-weight:800;font-size:12.5px;letter-spacing:.06em}
.monthtabs button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.optcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.optcard.lead{border-color:var(--brand-bright);box-shadow:0 0 0 1px var(--brand-bright)}
.reason{font-size:14px;background:var(--surface2);border-radius:8px;padding:9px 11px;color:var(--ink2)}
.optcard input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:6px}
.step::before{content:"";height:5px;border-radius:3px;background:var(--line)}
.step.done{color:var(--brand)}.step.done::before{background:var(--brand-bright)}
.step.stop{color:var(--bad)}.step.stop::before{background:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.faq{display:grid;gap:10px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
.faq summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
.faq summary::before{content:"+";width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;flex:none}
.faq details[open] summary::before{content:"–"}
.faq .ans{padding:0 16px 16px 48px;color:var(--ink2);max-width:75ch}
.faq .ans p{margin:0 0 8px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0}
.appr-row{display:grid;grid-template-columns:1.2fr 1.2fr 1.4fr auto auto;gap:8px;align-items:center}
.appr-row input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-width:0}
@media (max-width:700px){.appr-row{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:rise .2s ease-out}
.loading{display:grid;place-items:center;min-height:40vh;color:var(--muted);gap:10px;text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand-bright);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{border-top:1px solid var(--line);padding-block:18px;color:var(--muted);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:640px){.who{display:none}.top-row{gap:10px}.app-name{font-size:18px}.cal-title{font-size:22px;min-width:0}}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--on-brand)}

/* season strip */
.season{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(92px,1fr);gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:thin}
.smon{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 10px 8px;text-align:left;display:grid;gap:7px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;min-width:0}
.smon:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.smon.cur{border-color:var(--brand-bright);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand-bright) 35%,transparent);background:color-mix(in srgb,var(--brand-soft) 35%,var(--surface))}
.smon-h{display:flex;align-items:baseline;gap:6px;font-size:14px}.smon-h b{font-weight:800;font-style:italic;letter-spacing:-.01em}.smon-h .yr{font-size:11px;color:var(--muted);font-weight:700}
.smon-f{font-size:11.5px;font-weight:700;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:3px;min-height:9px}
.dots i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.dots i.s-available{background:var(--ok)}.dots i.s-partial{background:var(--brand-bright)}.dots i.s-requested{background:var(--warn-dot)}.dots i.s-soon{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}.dots i.s-full{background:var(--brand)}.dots i.s-hold{background:var(--hold)}.dots i.s-past{background:var(--line)}
.dots .none{font-size:11px;color:var(--muted)}
.cal-count{font-size:13.5px;font-weight:700}
.cal-hint{font-size:12.5px;margin:8px 2px 0}
/* your request markers */
.mydot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn-dot);box-shadow:0 0 0 2px var(--surface);margin-right:5px;vertical-align:1px;flex:none}
.evchip.mine{box-shadow:inset 0 0 0 2px var(--warn-dot)}
.mytag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--warn-dot);color:#231F20;white-space:nowrap}
.mytag.r-approved,.mytag.r-sent,.mytag.r-used{background:var(--ok);color:#fff}
.mine-call{display:grid;gap:10px;background:color-mix(in srgb,var(--warn-soft) 70%,var(--surface));border:1px solid color-mix(in srgb,var(--warn-dot) 45%,transparent)}
/* workflow panel */
.flow{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 18px;box-shadow:var(--shadow-sm);display:grid;gap:12px}
.flow-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;counter-reset:f}
.flow-steps li{display:flex;gap:10px;align-items:flex-start;position:relative;font-size:13px;line-height:1.35}
.flow-steps li b{display:block;font-size:14px;margin-bottom:2px}
.fnum{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);font-weight:800;font-style:italic;font-size:14px}
.flow-mine{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.fm-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) auto;gap:14px;align-items:center;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 12px;text-align:left;transition:border-color .15s ease}
.fm-row:hover{border-color:var(--brand-bright)}
.fm-t{display:grid;gap:2px;min-width:0}.fm-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fm-t .muted{font-size:12.5px}
@media (max-width:760px){.flow{padding:12px}.flow-steps{grid-template-columns:1fr 1fr;gap:8px}.flow-steps li>span>.muted{display:none}.flow-steps li b{font-size:13px;margin:4px 0 0}.fnum{width:24px;height:24px;font-size:12px}.fm-row{grid-template-columns:1fr}.season{grid-auto-columns:84px}.cal-hint{display:none}}

/* v5 calendar */
.page-head.compact{margin-bottom:12px}.page-head.compact h1{font-size:clamp(24px,2.8vw,32px)}.page-head.compact .lede{font-size:14.5px}
.flowbar{list-style:none;margin:0 0 14px;padding:10px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.flowbar li{display:flex;gap:9px;align-items:center;min-width:0;font-size:12.5px;line-height:1.3;position:relative}
.flowbar li b{display:block;font-size:13.5px}
.flowbar li>span:last-child{min-width:0}
.flowbar li:not(:last-child)::after{content:"›";position:absolute;right:-8px;color:var(--brand-mid);font-weight:800;font-size:18px}
.flowbar .fnum{width:24px;height:24px;font-size:12px}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.side-list{display:grid;gap:8px}
/* richer month tiles */
.cal .cell{min-height:142px}
.evchip{gap:5px;padding:7px 8px 7px}
.evchip .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px}
.evchip .sub .st{font-weight:800}
.evchip .mytag{font-size:10px;padding:1px 6px}
.evchip.s-full .mytag{background:var(--on-brand);color:var(--brand)}
.mdots{display:none}
.dayag{display:none}
/* week view */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wcol{border-right:1px solid var(--line);min-height:360px;display:flex;flex-direction:column;min-width:0}
.wcol:last-child{border-right:0}
.wcol.wknd{background:color-mix(in srgb,var(--brand-soft) 22%,transparent)}
.wcol.past{opacity:.6}
.wh{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);display:flex;align-items:baseline;gap:8px}
.wh .w{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wh .d{font-size:24px;font-weight:800;font-style:italic;line-height:1}
.wh .m{font-size:11.5px;font-weight:800;color:var(--brand-bright);letter-spacing:.08em;text-transform:uppercase}
.wcol.today .wh .d{color:#fff;background:var(--brand-bright);border-radius:10px;padding:2px 8px}
.wbody{padding:8px;display:grid;gap:8px;align-content:start}
.wnone{font-size:12px;color:var(--muted);padding:4px}
.wk-card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:grid;gap:6px;justify-items:start;border-left:5px solid var(--line);transition:transform .15s ease,box-shadow .15s ease;min-width:0}
.wk-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.wk-card .k{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wk-card .t{font-size:14px;line-height:1.25}
.wk-card .tm{font-size:12.5px;font-weight:700;color:var(--ink2)}
.wk-card .q{font-size:12px;font-weight:700;color:var(--warn)}
.wk-card .wk-seats{display:flex;gap:6px;align-items:center;font-size:12px;flex-wrap:wrap}
.wk-card .pill{font-size:11.5px;padding:2px 8px}
.wk-card.s-available{border-left-color:var(--ok)}.wk-card.s-partial{border-left-color:var(--brand-bright)}.wk-card.s-requested{border-left-color:var(--warn-dot)}.wk-card.s-full{border-left-color:var(--brand)}.wk-card.s-hold{border-left-color:var(--hold)}.wk-card.s-soon{border-left-color:var(--muted)}
.wk-card.mine{box-shadow:0 0 0 2px var(--warn-dot)}
/* hover preview */
.pop{position:fixed;z-index:35;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:none;gap:8px;pointer-events:none;font-size:13.5px}
.pop.on{display:grid;animation:rise .12s ease-out}
.pop .pop-t{font-size:16px;font-weight:800;font-style:italic;line-height:1.2}
.pop .pop-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pop .seats.big .seat{width:20px;height:25px}.pop .seats.big .park{width:25px;height:25px}
.pop .pop-my{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 9px;font-weight:700}
.pop .pop-f{font-size:12px;color:var(--brand-bright);font-weight:700}
.legend .mytag{align-self:center}
.dayrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;border-left:5px solid var(--line);width:100%}
.dayrow.s-available{border-left-color:var(--ok)}.dayrow.s-partial{border-left-color:var(--brand-bright)}.dayrow.s-requested{border-left-color:var(--warn-dot)}.dayrow.s-full{border-left-color:var(--brand)}.dayrow.s-hold{border-left-color:var(--hold)}
.dr-time{font-size:12.5px;font-weight:800;color:var(--ink2)}.dr-main{display:grid;min-width:0}.dr-main .muted{font-size:12.5px}
.dr-side{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (max-width:960px){.flowbar{grid-template-columns:1fr 1fr}.flowbar li::after{display:none}}
@media (max-width:760px){
 .flowbar li>span:last-child .muted{display:none}
 .cal .cell{min-height:58px;padding:4px;align-items:center}
 .cal .cell .evchip{display:none}
 .cal .cell .num{width:24px;height:24px;font-size:12px}
 .mdots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
 .mdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
 .mdots i.s-available{background:var(--ok)}.mdots i.s-partial{background:var(--brand-bright)}.mdots i.s-requested{background:var(--warn-dot)}.mdots i.s-full{background:var(--brand)}.mdots i.s-hold{background:var(--hold)}.mdots i.s-soon{box-shadow:inset 0 0 0 1.5px var(--muted);background:transparent}
 .mdots i.my{outline:2px solid var(--warn-dot);outline-offset:1px}
 .cal .cell[data-a]{cursor:pointer}
 .cal .cell.sel{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand-bright)}
 .dayag{display:grid;gap:10px;margin-top:12px}
 .dayrows{display:grid;gap:8px}
 .week{grid-template-columns:1fr}
 .wcol{min-height:0;border-right:0;border-bottom:1px solid var(--line);flex-direction:row}
 .wcol:last-child{border-bottom:0}
 .wh{flex-direction:column;align-items:center;justify-content:center;width:64px;flex:none;border-bottom:0;border-right:1px solid var(--line);padding:8px 4px;gap:2px}
 .wbody{flex:1;min-width:0}
}

/* help + guidance */
.guide{gap:14px}.gsteps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.gsteps li{display:flex;gap:14px;align-items:flex-start}
.gsteps li b{display:block;font-size:15.5px;margin-bottom:2px}
.gsteps li p{margin:0 0 8px;color:var(--ink2);max-width:70ch}
.gsteps .fnum{width:32px;height:32px;font-size:15px}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.map>div{display:grid;gap:2px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.nextstep{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--brand-soft);color:var(--brand);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-weight:600}
.nextstep .btn{margin-left:auto}
.miniflow{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:10px 0 0;padding:0;counter-reset:m}
.miniflow li{counter-increment:m;display:flex;align-items:center;gap:7px;font-size:13px;background:var(--surface2);border-radius:999px;padding:4px 12px 4px 5px}
.miniflow li::before{content:counter(m);width:20px;height:20px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:11px}

/* ticket picker */
.tixpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.tixpick button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 8px 9px;display:grid;justify-items:center;gap:6px;transition:border-color .15s,background .15s,transform .1s}
.tixpick button:hover{border-color:var(--brand-mid)}
.tixpick button.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
.tixpick button.over:not(.on){opacity:.7}
.tixpick .tn{font-size:28px;font-weight:800;font-style:italic;line-height:1;color:var(--brand)}
.tixpick .tl{font-size:12.5px;font-weight:700;color:var(--ink2)}
.tixpick .seats{display:flex;gap:2px;min-height:15px}
.qty{color:var(--brand);font-weight:800}

/* answers first */
.answers{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-bottom:6px;align-items:stretch}
.answers .side-card{margin-bottom:8px}
.achips{display:grid;gap:8px}
.achip{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 12px;text-align:left;border-left:5px solid var(--ok);transition:transform .12s,border-color .12s}
.achip:hover{transform:translateY(-1px);border-color:var(--brand-bright)}
.achip.s-partial{border-left-color:var(--brand-bright)}.achip.s-requested{border-left-color:var(--warn-dot)}.achip.s-soon{border-left-color:var(--muted)}
.achip .ad{font-weight:800;font-style:italic;color:var(--brand)}.achip .at{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.achip .as{font-size:12.5px;font-weight:700;color:var(--ink2)}
@media (max-width:860px){.answers{grid-template-columns:1fr}}
.stub,.stub.s-available,.stub.s-partial,.stub.s-requested,.stub.s-full,.stub.s-hold,.stub.s-soon,.stub.s-past{background:var(--surface);color:var(--ink)}
.stub .stub-date{color:var(--on-brand)}
.achip{grid-template-columns:98px minmax(0,1fr) auto}
.achip .ad{white-space:nowrap}
</style>

function evState(e){
  const i=inv(e);
  if(ed(e)<TODAY)return{key:"past",label:"Past"};
  if(e.hold&&i.left===0)return{key:"hold",label:isNana()?"Not available · "+e.hold.type:"Not available"};
  if(i.left===0)return{key:"full",label:"Fully booked"};
  if(i.line.length)return{key:"requested",label:"Requested · "+i.line.length+" in line"};
  if(i.taken>0)return{key:"partial",label:i.left+" of "+i.cap+" left"};
  if(e.comingSoon)return{key:"soon",label:"Coming soon"};
  return{key:"available",label:"Available"};
}
function shortLabel(e){const s=evState(e),i=inv(e);return({available:"Available",partial:i.left+" left",requested:i.line.length+" in line",full:"Booked",hold:"Not available",soon:"Coming soon",past:"Past"})[s.key]}
const spill=e=>{const s=evState(e);return `<span class="pill s-${s.key}">${esc(s.label)}</span>`};
const rpill=r=>`<span class="pill r-${r.status}">${RL[r.status]||r.status}</span>`;
function seats(e,big){const i=inv(e);const h=e.hold?Number(e.hold.tickets)||0:0;let s="";for(let k=0;k<i.cap;k++)s+=`<span class="seat ${k<h?"hold":k<i.taken?"on":""}"></span>`;
  const pc=i.pcap===0?"none":(e.hold&&Number(e.hold.parking))?"hold":i.parkLeft===0?"on":"";
  return `<span class="seats ${big?"big":""}" role="img" aria-label="${i.left} of ${i.cap} tickets open${i.pcap?", parking pass "+(i.parkLeft?"open":"taken"):""}">${s}<span class="park ${pc}">P</span></span>`}
function nextOption(e){return Math.max(0,...reqsOf(e).filter(r=>ACTIVE.includes(r.status)||HOLDS.includes(r.status)).map(r=>Number(r.option)||0))+1}
const amount=(t,p)=>`(${t}) ticket${Number(t)>1?"s":""}${p?" + (1) parking pass":""}`;
const guestsOf=r=>(r.attendees||[]).filter(g=>g&&g.name);
const guestLine=r=>{const g=guestsOf(r);return g.length?"Also coming: "+g.map(x=>x.name+(x.title?" ("+x.title+")":"")).join(", "):""};
function tixPicker(cur,cap,left){return `<div class="tixpick" role="radiogroup" aria-labelledby="tix-l">${Array.from({length:cap},(_,k)=>k+1).map(n=>`<button type="button" role="radio" aria-checked="${cur===n}" class="${cur===n?"on":""} ${n>left?"over":""}" data-a="tixpick" data-v="${n}"><span class="tn tnum">${n}</span><span class="seats">${Array.from({length:n},()=>'<span class="seat on"></span>').join("")}</span><span class="tl">${n===cap&&cap>2?"All "+cap:n===1?"1 ticket":n+" tickets"}</span></button>`).join("")}</div>`}
function tixHint(cur,i){if(!i)return "We have 4 tickets, if available.";const left=i.left,pend=i.pending;let t=`${left} of ${i.cap} tickets open${i.cap-left?` (${i.cap-left} already approved)`:""}.`;if(pend)t+=` ${pend} more ${pend>1?"are":"is"} requested and waiting for approval.`;
  if(cur>left)t+=left?` You chose ${cur}, which is more than what's open. You'd be a backup for the full ${cur}, or choose ${left} to fit.`:` You'd be a backup if they come back.`;
  else t+=cur===left?` Your ${cur} would be all that's open.`:` That leaves ${left-cur} for someone else.`;return t}
function guestRows(cur,d){if(cur<2)return"";const g=d.guests||[];return `<fieldset><legend>Who's coming <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:600">(optional)</span></legend><p class="muted" style="margin:0 0 4px">Your client counts as guest 1. Add the other ${cur-1} now, or leave them blank and add the names later (from My requests; Nana can add them too).</p>${Array.from({length:cur-1},(_,k)=>`<div class="grid2">${field("f-g-"+k+"-n","Guest "+(k+2)+" full name",`<input id="f-g-${k}-n" value="${esc((g[k]||{}).name||"")}">`)}${field("f-g-"+k+"-t","Title / company",`<input id="f-g-${k}-t" value="${esc((g[k]||{}).title||"")}">`)}</div>`).join("")}</fieldset>`}
function readGuests(){const g=[];for(let k=0;k<8;k++){if(!document.getElementById("f-g-"+k+"-n"))break;g.push({name:val("f-g-"+k+"-n"),title:val("f-g-"+k+"-t")})}return g}
function typeFor(r){const d=r.dept||"";if(/Market|Social/.test(d))return"Marketing Request";if(/Destination|Services/.test(d))return"Destination Services & Events Request";if(/Sales/.test(d))return"Sales Request";if(/Commun/.test(d))return"Communications Request";if(/Tourism/.test(d))return"Tourism Request";if(/Sport/.test(d))return"Sports Request";return"VA Team Request"}
const myReq=e=>mine().filter(r=>r.eventId===e.id&&!['declined','cancelled'].includes(r.status)).sort((a,b)=>a.option-b.option)[0];
const myTag=e=>{if(S.mode!=='requester')return'';const r=myReq(e);return r?`<span class="mytag r-${r.status}" title="Your request: Option ${r.option} · ${RL[r.status]}">You · Opt ${r.option}</span>`:''};
const upcoming=()=>D.events.filter(e=>ed(e)>=TODAY);
function mine(){const em=(S.me.email||"").toLowerCase();return D.requests.filter(r=>(S.me.id&&r.requesterId===S.me.id)||(em&&(r.requesterEmail||"").toLowerCase()===em))}
function toast(m){S.toast=m;renderToast();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast="";renderToast()},3200)}
const clientLine=r=>[r.clientName,r.clientCompany].filter(Boolean).join(", ")||"Client details to be added";
const forLine=r=>(r.clientName||r.clientCompany)?"For "+clientLine(r):"Client details to be added";
function sentNote(r){if(!r.sentMethod)return"";const d=pd(r.sentDate);return (r.sentMethod==="physical"?`Physical tickets to ${first(r.clientName)}`:`Transferred (${r.tickets}) tickets to ${first(r.clientName)}`)+` - ${r.sentBy||settings().initials} ${d?md(d):""}`}

/* ---------- data writes ---------- */
function fail(e){console.error(e);toast(e&&e.code==="invalid_argument"?"You don't have permission to change this. Ask Nana for access.":"That didn't save. Check your connection and try again.")}
function hist(r,text){return (r.history||[]).concat([{at:Date.now(),by:S.me.name||"Someone",text}]).slice(-40)}
async function upd(r,patch,note){patch=Object.assign({},patch);if(note)patch.history=hist(r,note);Object.assign(r,patch);renderAll();if(!db)return true;try{await db.doc("requests/"+r.id).update(patch);return true}catch(e){fail(e);return false}}
async function updEvent(e,patch){Object.assign(e,patch);delete e._d;renderAll();if(!db)return;try{await db.doc("events/"+e.id).update(patch)}catch(x){fail(x)}}
async function createReq(data){const id="r-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const doc=Object.assign({history:[{at:Date.now(),by:S.me.name||data.requesterName,text:"Request submitted"}]},data);D.requests.push(Object.assign({id},doc));renderAll();if(!db)return id;try{await db.doc("requests/"+id).set(doc)}catch(e){fail(e)}return id}
async function promote(e){
  const i=inv(e);let left=i.left,park=i.parkLeft;const out=[];
  for(const r of reqsOf(e).filter(x=>x.status==="backup").sort((a,b)=>a.option-b.option)){
    if(Number(r.tickets)<=left){left-=Number(r.tickets);const p={status:"approved"};if(r.parking){if(park>0)park--;else p.parking=false}await upd(r,p,"Moved up after tickets were released");out.push(r)}
  }
  return out;
}
async function approve(r,who,note){
  const e=evById(r.eventId),i=inv(e);const fits=Number(r.tickets)<=i.left;const p={approver:who,approvedAt:Date.now(),decisionNote:note||"",status:fits?"approved":"backup"};
  if(fits&&r.parking&&i.parkLeft<1)p.parking=false;
  await upd(r,p,(fits?"Approved by ":"Approved as backup by ")+who+(note?": "+note:""));
  if(window.__mail&&window.__mail.enabled){const st=settings();
    if(r.requesterEmail)window.__mail.send({to:r.requesterEmail,subject:`${fits?"Approved":"Approved as backup"}: ${title(e)} · ${fmt(ed(e))}`,replyTo:st.coordinatorEmail||undefined,text:fits?`Hi ${first(r.requesterName)},\n\n${who} approved your request for ${amount(r.tickets,p.parking===false?false:r.parking)} to ${title(e)} on ${fmtLong(ed(e))}.${note?"\n\nNote: "+note:""}\n\n${first(st.coordinator)} will transfer the tickets to ${r.sendTo} the week of the event, in case of cancellation.${sig()}`:`Hi ${first(r.requesterName)},\n\n${who} approved you as a backup (Option ${r.option}) for ${title(e)} on ${fmtLong(ed(e))}. If an earlier option can't go, you'll move up automatically and hear from ${first(st.coordinator)}.${sig()}`}).catch(()=>{});
    if(!isNana()&&st.coordinatorEmail)window.__mail.send({to:st.coordinatorEmail,subject:`${who} ${fits?"approved":"approved as backup"}: ${title(e)} · ${r.requesterName}`,text:`${who} ${fits?"approved":"approved as a backup"} Option ${r.option} for ${title(e)} on ${fmtLong(ed(e))}: ${r.requesterName} for ${r.clientName}, ${r.clientCompany}.${note?"\nNote: "+note:""}\n\nIt's in the Approved column of your workflow: ${location.origin}`}).catch(()=>{});}
  return p.status;
}

/* ---------- messages (copy into Outlook) ---------- */
function openMsg(o){S.modal=Object.assign({type:"msg"},o);renderOverlay()}
const sig=()=>`\n\nThank you,\n${first(settings().coordinator)}`;
function msgConfirm(r,e){return r.option===1?`Hi ${first(r.requesterName)},\n\nGood news: the tickets for ${title(e)} on ${fmtLong(ed(e))} are available, and you're Option 1 for ${amount(r.tickets,r.parking)}.${guestsOf(r).length?"\n"+guestLine(r)+".":""}\n\nI'm sending your request to ${primaryApprover().name} for approval and will let you know as soon as I hear back.${sig()}`
  :`Hi ${first(r.requesterName)},\n\nThanks for your request for ${title(e)} on ${fmtLong(ed(e))}. You're Option ${r.option} for this event (${amount(r.tickets,r.parking)}). Option 1 has first priority; if their plans change, you're next in line.\n\nI'll keep you posted.${sig()}`}
function primaryApprover(){return settings().approvers.find(a=>a.primary)||settings().approvers[0]||{name:"Ronnie"}}
function msgApproval(e,rs,to){const lines=rs.map(r=>`Option ${r.option}: ${r.requesterName}, ${r.requesterTitle} (${r.dept})\n  Client: ${[r.clientName,r.clientTitle,r.clientCompany].filter(Boolean).join(", ")||"to be added"}\n  ${amount(r.tickets,r.parking)}${guestsOf(r).length?"\n  "+guestLine(r):""}\n  Reason: ${r.reason}`).join("\n\n");
  return `Hi ${first(to)},\n\nCould you review ${rs.length>1?"these ticket requests":"this ticket request"}?\n\n${title(e)} · ${fmtLong(ed(e))} · ${fmtTime(e.time)}\nTickets open: ${inv(e).left} of ${inv(e).cap}\n\n${lines}\n\nYou can approve in Event Tickets (${APP_URL}) under Approvals, or just reply to this email.${sig()}`}
function msgSent(r,e){return `Hi ${first(r.requesterName)},\n\n${r.sentMethod==="physical"?`The physical tickets for ${title(e)} are ready for you to pick up.`:`I transferred ${r.tickets} ticket${r.tickets>1?"s":""} for ${title(e)} to ${r.sendTo}.`}${r.parking?" The parking pass is included.":""}\n\n${fmtLong(ed(e))} · ${fmtTime(e.time)} · ${e.venue}\n\nIf plans change, please let me know right away so another team can use them.${sig()}`}
function msgPromoted(r,e){return `Hi ${first(r.requesterName)},\n\nTickets for ${title(e)} on ${fmtLong(ed(e))} were released, and you were next in line as Option ${r.option}. ${r.approver||primaryApprover().name} already approved you as a backup, so they're yours.\n\nI'll send them to ${r.sendTo} the week of the event.${sig()}`}
function msgDeclined(r,e,note){return `Hi ${first(r.requesterName)},\n\nUnfortunately the tickets for ${title(e)} on ${fmtLong(ed(e))} aren't available for this request.${note?"\n\n"+note:""}\n\nThe calendar in Event Tickets shows what's still open.${sig()}`}
function msgUpdate(){const list=upcoming().filter(e=>days(ed(e),TODAY)<=30);return `Hi all,\n\nHere are the Honda Center and Angels events coming up in the next 30 days:\n\n${list.map(e=>`${fmt(ed(e))} · ${title(e)} · ${fmtTime(e.time)} · ${evState(e).label}`).join("\n")}\n\nIf anyone on your team would like tickets for a client, please request them in Event Tickets: ${APP_URL}${sig()}`}

/* ---------- header / nav ---------- */
function header(){
  const modes=isNana()?`<div class="modes" role="group" aria-label="View"><button data-a="mode" data-v="requester" aria-pressed="${S.mode==="requester"}">Requester view</button><button data-a="mode" data-v="nana" aria-pressed="${S.mode==="nana"}">Nana's view</button></div>`:"";
  const tabs=S.mode==="nana"?[["work","Workflow",boardCount()],["events","Calendar & events",0],["tracker","Tracker",0],["joy","Joy's report",0],["help","How it works",0],["answers","Questions & answers",0],["settings","Settings",0]]
    :[["events","Events",0],["mine","My requests",mine().filter(r=>!CLOSED.includes(r.status)).length],...((isApprover()||isNana()||window.__VERCEL)?[["approvals","Approvals",D.requests.filter(r=>r.status==="approval").length]]:[]),["help","How it works",0]];
  const cur=S.tab[S.mode];
  return `<header class="top"><div class="wrap"><div class="top-row">
  <img class="logo logo-light" src="${LOGO_TEAL}" alt="Visit Anaheim"><img class="logo logo-dark" src="${LOGO_LIGHT}" alt="Visit Anaheim">
  <div class="app-name">Event Tickets</div><div class="spacer"></div>${modes}
  ${S.me.name?`<span class="who"><img src="${esc(S.me.avatarUrl)}" alt="">${esc(first(S.me.name))}</span>`:""}
  </div><nav class="nav" aria-label="Sections">${tabs.map(([k,l,n])=>`<button data-a="tab" data-v="${k}" ${cur===k?'aria-current="page"':""}>${l}${n?`<span class="badge tnum">${n}</span>`:""}</button>`).join("")}</nav></div></header>`;
}
function boardCount(){return D.requests.filter(r=>["new","confirmed"].includes(r.status)||(r.status==="approved"&&dueSoon(r))||r.comingBack).length}
function dueSoon(r){const e=evById(r.eventId);if(!e)return false;const d=days(ed(e),TODAY);return d>=0&&d<=7}

/* ---------- calendar (shared) ---------- */
const OPEN_KEYS=["available","partial","soon","requested"];
function calEvents(){return D.events.filter(e=>e.venue===S.venue&&(S.kind==="all"||e.kind===S.kind||(S.kind==="ducks"&&e.kind==="angels"))&&(!S.openOnly||OPEN_KEYS.includes(evState(e).key)))}
const sow=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const narrow=()=>matchMedia("(max-width:760px)").matches;
const mineOn=e=>S.mode==="requester"&&myReq(e);
function stubHtml(e){const s=evState(e),d=ed(e);return `<button class="stub s-${s.key}" data-a="open" data-v="${e.id}" data-pop="${e.id}"><span class="stub-date"><span class="m">${MON[d.getMonth()].slice(0,3).toUpperCase()}</span><span class="d tnum">${d.getDate()}</span><span class="w">${DOW[d.getDay()]}</span></span><span class="stub-body"><span><span class="stub-title">${esc(title(e))}</span><span class="stub-meta" style="display:block">${fmtTime(e.time)} · ${esc(e.venue)}</span></span><span style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap"><span class="pill s-${s.key}">${esc(shortLabel(e))}</span>${myTag(e)}${seats(e)}</span></span></button>`}
function railHtml(vert){const list=calEvents().filter(e=>ed(e)>=TODAY).slice(0,vert?6:12);if(!list.length)return"";
  return `<div class="overline" style="margin:4px 0 8px">Up next</div><div class="rail ${vert?"vert":""}" aria-label="Next events">${list.map(stubHtml).join("")}</div>`}
function calCount(){const up=calEvents().filter(e=>ed(e)>=TODAY);const open=up.filter(e=>OPEN_KEYS.includes(evState(e).key)).length;return up.length?`${up.length} upcoming · ${open} open`:""}
function seasonHtml(){
  const base=D.events.filter(e=>e.venue===S.venue&&(S.kind==="all"||e.kind===S.kind)&&ed(e)>=new Date(TODAY.getFullYear(),TODAY.getMonth(),1));if(!base.length)return"";
  const last=base.reduce((m,e)=>ed(e)>m?ed(e):m,TODAY);const months=[];for(let d=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);d<=last;d=new Date(d.getFullYear(),d.getMonth()+1,1))months.push(d);
  const ref=S.calView==="week"?addDays(S.week,3):S.month;
  return `<div class="season" role="group" aria-label="Season at a glance">${months.map((m,ix)=>{const es=base.filter(e=>ed(e).getFullYear()===m.getFullYear()&&ed(e).getMonth()===m.getMonth());const open=es.filter(e=>OPEN_KEYS.includes(evState(e).key)).length;const cur=m.getFullYear()===ref.getFullYear()&&m.getMonth()===ref.getMonth();const my=es.some(mineOn);
    return `<button class="smon ${cur?"cur":""}" data-a="gomonth" data-v="${ymd(m)}" aria-pressed="${cur}" aria-label="${MON[m.getMonth()]} ${m.getFullYear()}: ${es.length} events, ${open} open"><span class="smon-h"><b>${MON[m.getMonth()].slice(0,3)}</b>${m.getMonth()===0||ix===0?`<span class="yr">${m.getFullYear()}</span>`:""}${my?'<span class="mydot"></span>':""}</span><span class="dots">${es.map(e=>`<i class="s-${evState(e).key}"></i>`).join("")||'<span class="none">No events</span>'}</span><span class="smon-f tnum">${es.length?open+" open":"&nbsp;"}</span></button>`}).join("")}</div>`}
function tileHtml(e){const s=evState(e),my=mineOn(e);
  return `<button class="evchip s-${s.key} ${my?"mine":""}" data-a="open" data-v="${e.id}" data-pop="${e.id}" aria-label="${esc(title(e))}, ${fmtTime(e.time)}, ${esc(s.label)}${my?", your request is Option "+my.option:""}"><span class="t">${esc(title(e))}</span><span class="sub"><span>${fmtTime(e.time)}</span><span class="st">${esc(shortLabel(e))}</span></span><span class="sub">${seats(e)}${my?`<span class="mytag r-${my.status}">You · Opt ${my.option}</span>`:""}</span></button>`}
function dayRow(e){const s=evState(e);return `<button class="dayrow s-${s.key}" data-a="open" data-v="${e.id}"><span class="dr-time tnum">${fmtTime(e.time)}</span><span class="dr-main"><b>${esc(title(e))}</b><span class="muted">${kindLabel(e)}</span></span><span class="dr-side">${spill(e)}${myTag(e)}${seats(e)}</span></button>`}
function monthHtml(list){
  const m=S.month,f=new Date(m.getFullYear(),m.getMonth(),1),start=sow(f);const n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate()+f.getDay()>35?42:35;
  const inMonth=list.filter(e=>ed(e).getMonth()===m.getMonth()&&ed(e).getFullYear()===m.getFullYear());
  let dk=S.day&&pd(S.day).getMonth()===m.getMonth()&&pd(S.day).getFullYear()===m.getFullYear()?S.day:null;
  if(!dk){const nx=inMonth.find(e=>ed(e)>=TODAY)||inMonth[0];dk=nx?nx.date:ymd(ymd(TODAY).slice(0,7)===ymd(m).slice(0,7)?TODAY:f)}
  let cells=DOW.map(d=>`<div class="dh">${d}</div>`).join("");
  for(let k=0;k<n;k++){const d=addDays(start,k),key=ymd(d);const es=list.filter(e=>e.date===key);
    cells+=`<div class="cell ${d.getMonth()!==m.getMonth()?"out":""} ${key===ymd(TODAY)?"today":""} ${d.getDay()%6===0?"wknd":""} ${key===dk&&es.length?"sel":""}" ${es.length?`data-a="pickday" data-v="${key}"`:""}><span class="num tnum">${d.getDate()}</span>${es.length?`<span class="mdots">${es.map(e=>`<i class="s-${evState(e).key}${mineOn(e)?" my":""}"></i>`).join("")}</span>`:""}${es.map(tileHtml).join("")}</div>`}
  const des=list.filter(e=>e.date===dk);
  return `<div class="cal-wrap" id="calwrap"><div class="cal cal-anim" style="--dx:${S.dx}px">${cells}</div></div>
  <div class="dayag"><h3>${fmt(pd(dk),{weekday:"long",month:"long",day:"numeric"})}</h3>${des.length?`<div class="dayrows">${des.map(dayRow).join("")}</div>`:`<p class="muted" style="margin:0">No events this day. Tap a day with dots to see its events.</p>`}</div>`}
function weekCard(e){const s=evState(e),i=inv(e),my=mineOn(e);
  return `<button class="wk-card s-${s.key} ${my?"mine":""}" data-a="open" data-v="${e.id}" data-pop="${e.id}"><span class="k">${kindLabel(e)}</span><b class="t">${esc(title(e))}</b><span class="tm tnum">${fmtTime(e.time)}</span>${spill(e)}<span class="wk-seats">${seats(e)}<span class="muted tnum">${i.left} of ${i.cap} open</span></span>${i.line.length?`<span class="q">${i.line.length} in line</span>`:""}${my?`<span class="mytag r-${my.status}">You · Opt ${my.option} · ${RL[my.status]}</span>`:""}</button>`}
function weekHtml(list){let cols="";
  for(let k=0;k<7;k++){const d=addDays(S.week,k),key=ymd(d),es=list.filter(e=>e.date===key);
    cols+=`<div class="wcol ${key===ymd(TODAY)?"today":""} ${d.getDay()%6===0?"wknd":""} ${d<TODAY?"past":""}"><div class="wh"><span class="w">${DOW[d.getDay()]}</span><span class="d tnum">${d.getDate()}</span>${k===0||d.getDate()===1?`<span class="m">${MON[d.getMonth()].slice(0,3)}</span>`:""}</div><div class="wbody">${es.length?es.map(weekCard).join(""):'<span class="wnone">No events</span>'}</div></div>`}
  return `<div class="cal-wrap" id="calwrap"><div class="week cal-anim" style="--dx:${S.dx}px">${cols}</div></div>`}
function listHtml(list){const up=list.filter(e=>ed(e)>=TODAY);const by={};up.forEach(e=>{const k=ed(e).getFullYear()*100+ed(e).getMonth();(by[k]=by[k]||[]).push(e)});
  return Object.keys(by).length?`<div class="agenda">${Object.keys(by).sort().map(k=>{const y=Math.floor(k/100),mm=k%100;return `<div class="agenda-month"><h2>${MON[mm]} ${y}</h2><div class="alist">${by[k].map(e=>{const i=inv(e),d=ed(e);const ppl=[...i.holders,...i.line].sort((a,b)=>a.option-b.option);const appr=[...new Set(i.holders.map(r=>r.approver).filter(Boolean))];
    return `<button class="arow" data-a="open" data-v="${e.id}"><span class="dblock"><span class="w">${DOW[d.getDay()]}</span><span class="d tnum">${d.getDate()}</span></span><span><span class="etitle">${esc(title(e))}</span><span class="emeta" style="display:block">${fmtTime(e.time)}${e.note?" · "+esc(e.note):""}</span></span><span class="opts">${ppl.length?ppl.map(r=>`<span class="optchip"><b>${r.option}</b>${esc(r.requesterName)}</span>`).join(""):'<span class="muted" style="font-size:13px">No requests yet</span>'}${appr.length?`<span class="optchip">Approved by ${esc(appr.join(", "))}</span>`:""}</span><span class="right">${spill(e)}${myTag(e)}${seats(e)}</span></button>`}).join("")}</div></div>`}).join("")}</div>`:`<div class="empty">Nothing matches these filters.</div>`}
function calLabel(){if(S.calView==="list")return"All upcoming";if(S.calView==="week"){const a=S.week,b=addDays(a,6);return a.getMonth()===b.getMonth()?`${MON[a.getMonth()].slice(0,3)} ${a.getDate()}–${b.getDate()}, ${b.getFullYear()}`:`${MON[a.getMonth()].slice(0,3)} ${a.getDate()} – ${MON[b.getMonth()].slice(0,3)} ${b.getDate()}, ${b.getFullYear()}`}return `${MON[S.month.getMonth()]} ${S.month.getFullYear()}`}
function calendarHtml(admin){
  const kinds=S.venue==="Angel Stadium"?[["all","All"]]:[["all","All events"],["ducks","Ducks games"],["concert","Concerts"],["show","Family shows"]];const unit=S.calView==="week"?"week":"month";
  const bar=`<div class="cal-bar">
   ${S.calView!=="list"?`<button class="icon-btn" data-a="month" data-v="-1" aria-label="Previous ${unit}">‹</button><span class="cal-title">${calLabel()}</span><button class="icon-btn" data-a="month" data-v="1" aria-label="Next ${unit}">›</button><button class="btn sm" data-a="today">Today</button>`:`<span class="cal-title">All upcoming</span>`}
   <span class="cal-count muted tnum">${calCount()}</span><span class="spacer"></span>
   <div class="seg" role="group" aria-label="Venue"><button data-a="venue" data-v="Honda Center" aria-pressed="${S.venue==="Honda Center"}">Honda Center</button><button data-a="venue" data-v="Angel Stadium" aria-pressed="${S.venue==="Angel Stadium"}">Angel Stadium</button></div>
   <div class="seg" role="group" aria-label="Layout">${[["month","Month"],["week","Week"],["list","List"]].map(([k,l])=>`<button data-a="calview" data-v="${k}" aria-pressed="${S.calView===k}">${l}</button>`).join("")}</div></div>
   <div class="chips" style="margin-bottom:12px">${kinds.map(([k,l])=>`<button class="chip-f" data-a="kind" data-v="${k}" aria-pressed="${S.kind===k}">${l}</button>`).join("")}<button class="chip-f" data-a="openonly" aria-pressed="${S.openOnly}">Only show open</button></div>`;
  const list=calEvents();
  if(!D.events.some(e=>e.venue===S.venue))return bar+`<div class="empty"><h3>${S.venue==="Angel Stadium"?"The 2027 Angels schedule isn't posted yet":"No events yet"}</h3><p>${S.venue==="Angel Stadium"?"Angels home games will show here as soon as Nana adds them.":"Events will show here as soon as Nana adds them."}</p>${admin?`<button class="btn primary" data-a="addevent">Add ${S.venue==="Angel Stadium"?"an Angels game":"an event"}</button>`:""}</div>`;
  const body=S.calView==="list"?listHtml(list):seasonHtml()+(S.calView==="week"?weekHtml(list):monthHtml(list))+`<p class="muted cal-hint">Tip: use the ← → keys to change ${unit}s. Hover an event for a quick look.</p>`;

/* ---------- event sheet ---------- */
function sheetHtml(){

   ${canReq?`<div class="actions"><button class="btn primary lg" data-a="request" data-v="${e.id}">${i.left===0||i.line.length?"Request as Option "+nx:"Request tickets"}</button></div>${i.left===0||i.line.length?`<p class="muted" style="margin:-8px 0 0">First come, first served. If an earlier option can't go, you move up.</p>`:""}`:""}

/* ---------- requester views ---------- */
function viewEvents(){
  const waiting=D.requests.filter(r=>r.status==="approval").length;
  return `<div class="page-head compact"><div><div class="overline">Honda Center · Angel Stadium</div><h1>${S.me.name?`Hi ${esc(first(S.me.name))}, here's what's coming up`:"Upcoming events"}</h1><p class="lede">Nana keeps this calendar current. Each event has 4 tickets and 1 parking pass, if available. Click an event, choose 1 to 4 tickets, and send. Nana confirms, Ronnie approves, and the tickets are transferred the week of the event.</p></div></div>
  ${welcome()}
  ${isApprover()&&waiting?`<div class="banner warn">${waiting} request${waiting>1?"s are":" is"} waiting for your approval. <button class="btn primary sm" data-a="tab" data-v="approvals">Review</button></div>`:""}
  ${flowHtml()}
  ${answerBar()}${railHtml(false)}${calendarHtml(false)}`;
}
function flowHtml(){const st=settings();
  const steps=[["Request","Pick an event, tell us about your client"],["Option confirmed",`${esc(first(st.coordinator))} confirms Option 1, 2 or 3`],["Approved",`${esc(primaryApprover().name)} or another C-suite member`],["Tickets sent","Usually the week of the event"]];
  return `<ol class="flowbar" aria-label="How requests work">${steps.map(([h,t],k)=>`<li><span class="fnum">${k+1}</span><span><b>${h}</b><span class="muted">${t}</span></span></li>`).join("")}</ol>`}
function answerBar(){const open=upcoming().filter(e=>OPEN_KEYS.includes(evState(e).key)).slice(0,4);
  const chips=open.length?open.map(e=>{const s=evState(e);return `<button class="achip s-${s.key}" data-a="open" data-v="${e.id}"><span class="ad tnum">${fmt(ed(e))}</span><span class="at">${esc(title(e))}</span><span class="as">${esc(shortLabel(e))}</span></button>`}).join(""):`<p class="muted" style="margin:0">Nothing is open right now. Check back soon.</p>`;
  return `<div class="answers"><section class="side-card"><div class="overline" style="margin-bottom:8px">Open soon · click one to request</div><div class="achips">${chips}</div></section>${mySide()}</div>`}
function mySide(){const open=mine().filter(r=>!CLOSED.includes(r.status)&&evById(r.eventId)).sort((a,b)=>ed(evById(a.eventId))-ed(evById(b.eventId)));if(!open.length)return `<section class="side-card"><div class="overline" style="margin-bottom:8px">Your requests</div><p style="margin:0"><b>You have no requests yet.</b></p><p class="muted" style="margin:4px 0 0;font-size:13.5px">Click an open event, choose 1 to 4 tickets and send. It takes about a minute. This box will then show where each request stands.</p></section>`;
  return `<section class="side-card"><div class="overline" style="margin-bottom:8px">Your requests in progress</div>${open.length?`<div class="side-list">${open.slice(0,4).map(r=>{const e=evById(r.eventId);return `<button class="fm-row" data-a="open" data-v="${e.id}"><span class="fm-t"><b>${esc(title(e))}</b><span class="muted tnum">${fmt(ed(e))} · Option ${r.option}</span></span>${stepper(r)}<span>${rpill(r)}</span></button>`}).join("")}</div>${open.length>4?`<button class="btn sm" data-a="gomine" style="margin-top:8px">See all ${open.length}</button>`:""}`:`<p class="muted" style="margin:0;font-size:13.5px">No open requests. Pick an event on the calendar to request tickets for a client.</p>`}</section>`}
function stepper(r){const map={new:0,confirmed:1,approval:1,approved:2,backup:2,sent:3,used:3};if(!(r.status in map))return `<div class="steps"><span class="step done">Requested</span><span class="step stop">${RL[r.status]}</span><span class="step"></span><span class="step"></span></div>`;
  return `<div class="steps">${["Requested","Option confirmed","Approved","Tickets sent"].map((l,k)=>`<span class="step ${k<=map[r.status]?"done":""}">${l}</span>`).join("")}</div>`}
function nextLine(r){const e=evById(r.eventId);switch(r.status){
  case"new":return"Nana is checking availability and will confirm your option number.";
  case"confirmed":return`You're Option ${r.option}. Nana is sending it for approval.`;
  case"approval":return`Waiting for approval${r.approver?" from "+esc(r.approver):""}.`;
  case"approved":return`Approved${r.approver?" by "+esc(r.approver):""}. Tickets go to ${esc(r.sendTo)} the week of the event.`;
  case"backup":return`Approved as a backup. If an earlier option can't go, you'll move up automatically.`;
  case"sent":return r.comingBack?"You told Nana the tickets are coming back.":`${r.sentMethod==="physical"?"Physical tickets are ready for pickup":"Tickets were transferred to "+esc(r.sendTo)}${r.sentDate?" on "+fmt(pd(r.sentDate)):""}.`;
  case"declined":return"Not approved this time."+(r.decisionNote?" Note: "+esc(r.decisionNote):"");
  default:return RL[r.status]+"."}}
function viewMine(){
  const list=mine().sort((a,b)=>(evById(a.eventId)?ed(evById(a.eventId)):0)-(evById(b.eventId)?ed(evById(b.eventId)):0));
  const open=list.filter(r=>!CLOSED.includes(r.status)),done=list.filter(r=>CLOSED.includes(r.status));
  const card=r=>{const e=evById(r.eventId);if(!e)return"";const future=ed(e)>=TODAY;const can=future&&["new","confirmed","approval","backup","approved"].includes(r.status);const back=future&&r.status==="sent"&&!r.comingBack;
    return `<div class="card"><div class="card-head"><span class="optbadge">Option ${r.option}</span><h3>${esc(title(e))}</h3><span class="muted tnum">${fmt(ed(e))} · ${fmtTime(e.time)}</span><span style="margin-left:auto">${rpill(r)}</span></div>${stepper(r)}
    <div>${nextLine(r)}</div><div class="muted" style="font-size:13.5px"><b>${amount(r.tickets,r.parking)}</b> · ${esc(forLine(r))}${guestsOf(r).length?`<br>${esc(guestLine(r))}`:""}</div>
    ${can||back?`<div><button class="btn sm" data-a="mytix" data-v="${r.id}">Change tickets or add guests</button></div>`:""}
    ${S.confirmCancel===r.id?`<div class="callout warn" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${back?"Let Nana know the tickets are coming back?":"Cancel this request? The tickets go to the next person in line."}<span class="spacer"></span><button class="btn sm" data-a="keep">Keep it</button><button class="btn sm primary" data-a="${back?"comingback":"cancelreq"}" data-v="${r.id}">Yes</button></div>`
      :(can||back)?`<div class="actions"><button class="btn sm danger" data-a="askcancel" data-v="${r.id}">${back?"My client can't go":r.status==="approved"?"Plans changed · release tickets":"Cancel request"}</button></div>`:""}</div>`};

  ${S.me.email?"":`<div class="callout" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap"><div class="field" style="min-width:260px;flex:1"><label for="me-email">Your work email</label><input id="me-email" type="email" placeholder="name@visitanaheim.org" autocomplete="email"></div><button class="btn primary" data-a="setme">Show my requests</button></div>`}
  <div class="stack">${open.length?open.map(card).join(""):`<div class="empty">No open requests. Pick an event on the Events tab to request tickets.</div>`}</div>
  ${done.length?`<details class="done-list"><summary>Past and closed requests (${done.length})</summary><div class="stack" style="margin-top:12px">${done.map(card).join("")}</div></details>`:""}`;
}

   <div><b>${esc(r.requesterName)}</b><div class="muted">${esc(r.requesterTitle)} · ${esc(r.dept)}</div></div><div>${esc(r.clientName||"Client to be added")}<div class="muted">${esc(r.clientTitle)} · ${esc(r.clientCompany)}</div>${guestsOf(r).length?`<div class="muted">${esc(guestLine(r))}</div>`:""}</div>
   <div class="reason">${esc(r.reason)}</div><input id="note-${r.id}" aria-label="Note" placeholder="Note (optional)">
   <div class="actions"><button class="btn primary" data-a="approve" data-v="${r.id}">Approve</button><button class="btn danger" data-a="reject" data-v="${r.id}">Don't approve</button></div></div>`).join("")}</div></div>`}).join(""):`<div class="empty">Nothing is waiting for approval right now.</div>`}</div>`;

/* ---------- Nana's views ---------- */
function wcard(r){
  const e=evById(r.eventId);if(!e)return"";const i=inv(e);const total=[...i.line,...i.holders].length;const due=r.status==="approved"&&dueSoon(r);const past=ed(e)<TODAY;
  const primary={new:["confirm","Confirm option"],confirmed:["sendappr","Send for approval"],approval:["record","Record decision"],approved:["marksent","Mark tickets sent"],sent:[r.comingBack||past?"howwent":"howwent",past?"How did it go?":"Tickets came back?"]}[r.status];
  const m=[];const line=i.line;
  if(ACTIVE.includes(r.status)&&line.length>1){const k=line.indexOf(r);if(k>0)m.push(["up",`Swap with Option ${line[k-1].option} (${first(line[k-1].requesterName)})`]);if(k<line.length-1)m.push(["down",`Swap with Option ${line[k+1].option} (${first(line[k+1].requesterName)})`])}
  m.push(["edit","Edit details"]);m.push(["viewevent","Open event"]);
  if(["new","confirmed"].includes(r.status))m.push(["notavail","Not available · let them know"]);
  if(r.status==="approval")m.push(["sendappr","Resend approval request"]);
  if(r.status==="approved"||r.status==="backup")m.push(["release","Plans changed · release"]);
  if(r.status==="sent")m.push(["used","Mark used"]);
  m.push(["delete","Delete request","danger"]);
  return `<div class="wcard ${due||r.comingBack?"due":""}"><div class="w-top"><span class="w-date tnum">${fmt(ed(e))}</span>${r.sample?'<span class="tag">Sample</span>':""}<span class="spacer"></span><span class="optbadge">Option ${r.option}${total>1?` of ${total}`:""}</span></div>
  <div class="w-title">${esc(title(e))}</div><div class="w-who"><b>${esc(r.requesterName)}</b>${r.dept&&r.dept!=="Other"?" · "+esc(r.dept):""}<br>${esc(forLine(r))}</div>
  <div class="muted" style="font-size:12.5px"><b class="qty">${amount(r.tickets,r.parking)}</b>${guestsOf(r).length?`<br>${esc(guestLine(r))}`:""}${r.status==="approval"&&r.approver?` · with ${esc(r.approver)}`:""}${HOLDS.includes(r.status)&&r.approver?` · approved by ${esc(r.approver)}`:""}${r.sentMethod?` · ${esc(sentNote(r))}`:""}</div>
  ${due?`<span class="pill r-approval">Send this week</span>`:""}${r.comingBack?`<span class="pill r-returned">Requester says tickets are coming back</span>`:""}${r.status==="backup"?`<span class="pill r-backup">Backup · moves up automatically</span>`:""}
  <div class="w-foot">${primary?`<button class="btn sm primary" data-a="${primary[0]}" data-v="${r.id}">${primary[1]}</button>`:"<span></span>"}<details class="more"><summary aria-label="More options">⋯</summary><div class="menu">${m.map(([a,l,c])=>`<button class="${c||""}" data-a="${a}" data-v="${r.id}">${l}</button>`).join("")}</div></details></div></div>`;
}
function inRange(r){const e=evById(r.eventId);if(!e)return false;const d=days(ed(e),TODAY);if(d<-14)return false;return S.range==="all"||d<=Number(S.range)}
function nextStep(){const c=k=>D.requests.filter(k).length;const nw=c(r=>r.status==="new"),cf=c(r=>r.status==="confirmed"),ap=c(r=>r.status==="approval"),due=c(r=>r.status==="approved"&&dueSoon(r)),back=c(r=>r.comingBack);
  const pl=(n,w)=>n+" "+w+(n===1?"":"s");let t;

  else if(due)t=`<b>Next step:</b> ${pl(due,"approved request")} to send this week. Click <b>Mark tickets sent</b>.`;

/* ---------- modals ---------- */
function field(id,label,input,hint,err){return `<div class="field ${err?"invalid":""}"><label for="${id}">${label}</label>${input}${hint?`<span class="hint">${hint}</span>`:""}${err?`<span class="err">${err}</span>`:""}</div>`}
function reqModal(m){

  if(m.done){const r=m.done;return dlg("Request sent",`<div style="display:grid;gap:14px"><div class="callout" style="font-size:16px">You're <b>Option ${r.option}</b> for ${esc(title(e))} on ${fmt(ed(e))}.<br><span style="font-size:14px">Asking for ${amount(r.tickets,r.parking)}${guestsOf(r).length?`. ${esc(guestLine(r))}`:""}</span></div><ol style="margin:0;padding-left:20px;display:grid;gap:8px"><li><b>Nana confirms availability</b> and lets you know your option number.</li><li><b>Ronnie approves</b>, or another C-suite member if he's out.</li><li><b>Tickets go to ${esc(r.sendTo)}</b>, usually the week of the event in case of cancellation.</li></ol></div>`,`<button class="btn" data-a="close">Done</button>${m.onBehalf?"":`<button class="btn primary" data-a="gomine">See my requests</button>`}`,"narrow")}
